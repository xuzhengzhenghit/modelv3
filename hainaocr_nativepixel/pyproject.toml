[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hainaocr-nativepixel"
version = "0.1.0"
description = "HainaOCR-NativePixel encoder-free OCR VLM model package"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.57",
    "Pillow",
]

[tool.setuptools.packages.find]
include = ["hainaocr_nativepixel*"]
